name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run dist:win
      - uses: softprops/action-gh-release@v2
        with:
          files: release/OfferTrack-Setup-*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run dist:mac
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/OfferTrack-*-arm64.dmg
            release/OfferTrack-*-x64.dmg
